# 生产环境：全部敏感项走环境变量（部署清单 V2 第 8 章 .env，权限 600，不入代码库）
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:herbal_tea}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:50}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0

wx:
  miniapp:
    appid: ${WX_MINIAPP_APPID}
    secret: ${WX_MINIAPP_SECRET}
  pay:
    mch-id: ${WXPAY_MCH_ID}
    api-v3-key: ${WXPAY_API_V3_KEY}
    private-key-path: ${WXPAY_PRIVATE_KEY_PATH}
    notify-url: ${WXPAY_NOTIFY_URL}

app:
  wx:
    # 生产禁用 mock 登录：必须走真实微信 code2session
    mock: false

sms:
  provider-key: ${SMS_PROVIDER_KEY}
  sign-name: ${SMS_SIGN_NAME}

oss:
  bucket: ${OSS_BUCKET}
  secret-id: ${OSS_SECRET_ID}
  secret-key: ${OSS_SECRET_KEY}

logistics:
  app-key: ${LOGISTICS_APP_KEY}
  secret: ${LOGISTICS_SECRET}

logging:
  level:
    com.herbaltea: INFO
